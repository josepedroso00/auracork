name: Sign IPA
on:
  push:
    branches: [main, master]

jobs:
  sign-sideloading:
    name: Sign IPA (Sideloading)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          if [ -z "$LATEST_XCODE" ]; then
            echo "Error: No Xcode installation found"
            exit 1
          fi
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Decode P12 certificate
        run: |
          set -euo pipefail
          echo "${{ secrets.P12_BASE64_SIDELOADING }}" | base64 --decode > certificate.p12
          if [ ! -s certificate.p12 ]; then
            echo "Error: P12 certificate file is empty or was not created"
            exit 1
          fi
          echo "P12 certificate decoded ($(wc -c < certificate.p12) bytes)"

      - name: Create temporary keychain and import certificate
        run: |
          set -euo pipefail
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

          security import certificate.p12 -k build.keychain \
            -P "${{ secrets.P12_PASSWORD_SIDELOADING }}" -T /usr/bin/codesign

          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" build.keychain

          echo "Keychain identities:"
          security find-identity -v -p codesigning build.keychain

      - name: Install provisioning profile
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE=$(ls sideloading/*.mobileprovision 2>/dev/null | head -1)
          if [ -z "$PROFILE" ]; then
            echo "Error: No .mobileprovision file found"
            exit 1
          fi
          cp sideloading/*.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "Provisioning profile installed: $PROFILE"

      - name: Build and sign IPA
        run: |
          set -euo pipefail
          cd sideloading
          chmod +x Compile.sh
          ./Compile.sh
          # Verify signed IPA was created (exclude original KClientV*.ipa template)
          IPA_FILE=$(ls *.ipa 2>/dev/null | grep -v "KClientV" | head -1)
          if [ -z "$IPA_FILE" ]; then
            echo "Error: No signed IPA file found after build"
            echo "Available files: $(ls *.ipa 2>/dev/null)"
            exit 1
          fi
          echo "Signed IPA created: $IPA_FILE ($(du -h "$IPA_FILE" | cut -f1))"

      - name: Identify signed IPA
        run: |
          cd sideloading
          SIGNED_IPA=$(ls *.ipa 2>/dev/null | grep -v "KClientV" | head -1)
          echo "signed_ipa=sideloading/$SIGNED_IPA" >> $GITHUB_OUTPUT
          echo "Artifact to upload: sideloading/$SIGNED_IPA"
        id: find-ipa

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: signed-ipa-sideloading
          path: "${{ steps.find-ipa.outputs.signed_ipa }}"
          retention-days: 7

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain 2>/dev/null || true
          rm -f certificate.p12

